[package]
name = "app"
description = "Blah Blah Bot desktop shell: tray, windows and IPC commands"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-dialog = "2.4"
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-single-instance = "2.5"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
store = { path = "../store" }
queue = { path = "../queue" }
cycle-store = { path = "../cycle-store" }
speakers = { path = "../speakers" }
publishers = { path = "../publishers" }
keyring-core = "1"
recorder = { path = "../recorder" }
bridge = { path = "../bridge" }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1"
windows.workspace = true

[dev-dependencies]
tempfile = "3"
test-tmp = { path = "../test-tmp" }
publishers = { path = "../publishers", features = ["test-support"] }

[features]
# Embeds the built UI instead of loading the dev server. Enabled for release builds.
custom-protocol = ["tauri/custom-protocol"]

[package.metadata.tauri-winres]
OriginalFilename = "app.exe"
InternalName = "app"
Comments = "Local meeting recorder with transcripts, speakers and reports"

[lints]
workspace = true
