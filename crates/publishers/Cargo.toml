[package]
name = "publishers"
description = "Publishing targets: HTTP layer, GitHub and Discord publishers, the publish plan with its rules and the outbox dispatcher, plus fake servers for tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Hand-written fake GitHub and Discord servers, for the tests of this crate and of the
# application. Never part of a release build.
test-support = ["dep:tempfile"]

[dependencies]
cycle-store = { path = "../cycle-store" }
serde.workspace = true
serde_json.workspace = true
store = { path = "../store" }
tempfile = { version = "3", optional = true }
thiserror.workspace = true
tracing.workspace = true
ureq = { version = "3.5", default-features = false, features = ["native-tls-no-default"] }

[dev-dependencies]
tempfile = "3"
tracing-subscriber = "0.3"
# The integration tests in `tests/` use the fake servers.
publishers = { path = ".", features = ["test-support"] }

[lints]
workspace = true
