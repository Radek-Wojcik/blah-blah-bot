[workspace]
resolver = "2"
members = ["crates/app", "crates/cycle-store", "crates/queue", "crates/recorder", "crates/speakers", "crates/store"]
exclude = ["benchmarks"]

[workspace.package]
version = "0.5.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
wasapi = "0.27"

[workspace.dependencies.windows]
version = "0.62.2"
features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_System_Performance",
  "Win32_System_WindowsProgramming",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
debug = false
lto = "thin"
