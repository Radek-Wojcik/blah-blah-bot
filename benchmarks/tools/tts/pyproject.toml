[project]
name = "bbb-tts"
version = "0.1.0"
description = "Synthetic multi-speaker meeting audio from scripted turns (benchmark tooling)"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "chatterbox-tts==0.1.7",
    "torch==2.6.0",
    "torchaudio==2.6.0",
    "numpy<2",
    "soundfile>=0.12",
    "scipy>=1.11",
    "piper-tts==1.8.0",
    "huggingface-hub",
    "setuptools<81",  # resemble-perth (Chatterbox watermarker) still imports pkg_resources
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bbb_tts"]

# CUDA 12.4 wheels on Windows (PyPI ships CPU-only torch there). Other platforms use PyPI.
[tool.uv.sources]
torch = [{ index = "pytorch-cu124", marker = "sys_platform == 'win32'" }]
torchaudio = [{ index = "pytorch-cu124", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
