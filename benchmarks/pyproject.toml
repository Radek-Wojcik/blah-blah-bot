[project]
name = "bbb-bench"
version = "0.1.0"
description = "Benchmark harness and metric code for Blah Blah Bot prototypes"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "scipy>=1.11",
    "jsonschema>=4.20",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "jiwer>=3.0",
]
asr = [
    "faster-whisper>=1.2.1",
    "nvidia-cublas-cu12==12.8.4.1",
    "nvidia-cudnn-cu12>=9,<10",
    "onnx-asr[gpu,hub]>=0.12",
]
diar = [
    "pyannote.audio>=4.0.7",
    "torch>=2.8",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128", marker = "sys_platform == 'win32'" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bbb_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
