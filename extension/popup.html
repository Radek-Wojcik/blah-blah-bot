<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blah Blah Bot</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font:
          13px system-ui,
          sans-serif;
        width: 300px;
        margin: 12px;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      label {
        display: block;
        margin: 6px 0 2px;
      }
      input[type="text"] {
        width: 100%;
        box-sizing: border-box;
        padding: 6px;
        font:
          15px ui-monospace,
          monospace;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      button {
        margin-top: 8px;
        padding: 6px 10px;
        width: 100%;
      }
      button.link {
        background: none;
        border: none;
        width: auto;
        padding: 0;
        color: inherit;
        text-decoration: underline;
        cursor: pointer;
        font-size: 12px;
      }
      #line {
        margin: 6px 0;
        min-height: 2.4em;
      }
      .err {
        color: #b71c1c;
      }
      .ok {
        color: #1b5e20;
      }
      @media (prefers-color-scheme: dark) {
        .err {
          color: #ff8a80;
        }
        .ok {
          color: #81c784;
        }
      }
      small {
        opacity: 0.75;
      }
    </style>
  </head>
  <body>
    <h1>Blah Blah Bot</h1>
    <div id="line" role="status"></div>
    <section id="pair" hidden>
      <label for="code">Pairing code from the application (Settings, Browser extension)</label>
      <input id="code" type="text" autocomplete="off" spellcheck="false" maxlength="12" />
      <button id="pairBtn">Pair</button>
    </section>
    <section id="capture" hidden>
      <button id="captureBtn">Capture this tab</button>
      <label><input id="auto" type="checkbox" checked /> Capture when this popup opens</label>
      <p>
        <small>Shortcut: Alt+Shift+R. Streams: <span id="count">0</span>.</small>
      </p>
      <button id="unpairBtn" class="link">Forget this pairing</button>
    </section>
    <script type="module" src="popup.js"></script>
  </body>
</html>
