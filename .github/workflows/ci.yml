name: CI

on:
  push:
    branches: [main, "stage/**"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            extension/package-lock.json
      - name: Rust format and lints
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
      - name: UI lints
        working-directory: ui
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run format:check
      - name: Extension lints
        working-directory: extension
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run format:check
      - name: Ruff
        run: |
          cd benchmarks
          uv run ruff check .
          uv run ruff format --check .
          cd ../worker
          uv sync --frozen --only-group dev
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            extension/package-lock.json
      - name: Rust unit and integration tests
        run: cargo test --workspace
      - name: UI unit tests
        working-directory: ui
        run: |
          npm ci
          npm test
      - name: Extension unit tests
        working-directory: extension
        run: |
          npm ci
          npm test
      - name: Benchmark unit tests (CPU only, no models)
        working-directory: benchmarks
        run: uv run pytest -q
      - name: Worker unit and contract tests (CPU only, no models)
        working-directory: worker
        run: |
          uv sync --frozen --only-group dev
          uv run --no-sync pytest -q
      - name: No scratch files left behind by the tests
        if: always()
        shell: pwsh
        run: ./scripts/check-temp-hygiene.ps1

  ui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            extension/package-lock.json
      - name: UI flows on the mock backend
        working-directory: ui
        run: |
          npm ci
          npx playwright test --project=mock
      - name: No scratch files left behind by the tests
        if: always()
        shell: pwsh
        run: ./scripts/check-temp-hygiene.ps1

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            extension/package-lock.json
      - name: Build the UI
        working-directory: ui
        run: |
          npm ci
          npm run build
      - name: Build and pack the extension
        working-directory: extension
        run: |
          npm ci
          npm run pack
      - name: Build the application
        run: cargo build -p app --features custom-protocol

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit message convention
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}..HEAD"
          else
            RANGE="HEAD"
          fi
          python3 scripts/check_commits.py "$RANGE"
      - name: Large and binary files
        run: python3 scripts/check_files.py
      - name: Release scripts and version consistency
        run: |
          python3 scripts/check_versions.py
          python3 -m unittest scripts.test_release_scripts

  audit:
    # Advisory and license check (uses deny.toml for the Windows target).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-deny
      - name: Dependency audit
        shell: pwsh
        run: ./scripts/audit-deps.ps1
