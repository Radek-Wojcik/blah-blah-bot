name: CI

on:
  push:
    branches: [main, "stage/**"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Rust format and lints
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
      - name: UI lints
        working-directory: ui
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run format:check
      - name: Ruff
        working-directory: benchmarks
        run: |
          uv run ruff check .
          uv run ruff format --check .

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Rust unit and integration tests
        run: cargo test --workspace
      - name: UI unit tests
        working-directory: ui
        run: |
          npm ci
          npm test
      - name: Benchmark unit tests (CPU only, no models)
        working-directory: benchmarks
        run: uv run pytest -q

  ui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: UI flows on the mock backend
        working-directory: ui
        run: |
          npm ci
          npx playwright test --project=mock

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build the UI
        working-directory: ui
        run: |
          npm ci
          npm run build
      - name: Build the application
        run: cargo build -p app --features custom-protocol

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit message convention
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}..HEAD"
          else
            RANGE="HEAD"
          fi
          python3 scripts/check_commits.py "$RANGE"
      - name: Large and binary files
        run: python3 scripts/check_files.py
